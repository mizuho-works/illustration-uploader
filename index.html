<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>イラストアップロード</title>
<style>
  :root { --bg:#fafaf7; --fg:#222; --card:#fff; --line:#d9d9d2; --accent:#e0457b; --ok:#1a8a4a; --ng:#c0392b; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#17171a; --fg:#eee; --card:#222226; --line:#3a3a40; }
  }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px 16px; background:var(--bg); color:var(--fg); font-family:system-ui,"Hiragino Sans","Yu Gothic",sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:1.3rem; margin:0 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  label { display:block; font-size:.85rem; margin-bottom:6px; opacity:.8; }
  select, input[type=password] { width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font-size:1rem; }
  #drop { border:2px dashed var(--line); border-radius:12px; padding:32px 12px; text-align:center; cursor:pointer; }
  #drop.over { border-color:var(--accent); }
  button { width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-size:1rem; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
  ul { list-style:none; padding:0; margin:12px 0 0; font-size:.9rem; }
  li { padding:4px 0; display:flex; justify-content:space-between; gap:8px; }
  .ok { color:var(--ok); } .ng { color:var(--ng); }
  small { opacity:.7; }
</style>
</head>
<body>
<main>
  <h1>イラストをアップロード</h1>

  <div class="card">
    <label for="cat">保存先フォルダ</label>
    <select id="cat">
      <option>01_キャラクター</option>
      <option>02_装飾・アイコン</option>
      <option>03_背景・パターン</option>
      <option>04_吹き出し・枠</option>
    </select>
  </div>

  <div class="card">
    <div id="drop">ここにドラッグ&ドロップ<br>またはクリックして選択<br><small>PNG / SVG / JPG(複数OK)</small></div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <ul id="list"></ul>
  </div>

  <div class="card">
    <button id="go" disabled>アップロード</button>
  </div>

  <div class="card">
    <label for="token">GitHubトークン(このブラウザにだけ保存されます)</label>
    <input id="token" type="password" placeholder="github_pat_..." autocomplete="off">
    <small>権限:対象リポジトリの Contents を Read and write</small>
  </div>
</main>

<script>
const REPO = "mizuho-works/illustration-collection";
const BRANCH = "main";
const $ = id => document.getElementById(id);
let files = [];

try { $("token").value = localStorage.getItem("ghToken") || ""; } catch (e) {}
$("token").addEventListener("input", () => {
  try { localStorage.setItem("ghToken", $("token").value.trim()); } catch (e) {}
});

const drop = $("drop");
drop.onclick = () => $("file").click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };
$("file").onchange = e => add(e.target.files);

function add(fl) {
  files = files.concat([...fl].filter(f => f.type.startsWith("image/")));
  render();
}
function render() {
  $("list").innerHTML = "";
  files.forEach(f => {
    const li = document.createElement("li");
    li.innerHTML = `<span></span><span class="st">待機中</span>`;
    li.firstChild.textContent = f.name;
    f._li = li;
    $("list").appendChild(li);
  });
  $("go").disabled = files.length === 0;
}

function toBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result.split(",")[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function api(path, opts = {}) {
  return fetch(`https://api.github.com/repos/${REPO}/contents/${path}`, {
    ...opts,
    headers: {
      Authorization: "Bearer " + $("token").value.trim(),
      Accept: "application/vnd.github+json",
      ...(opts.headers || {})
    }
  });
}

$("go").onclick = async () => {
  if (!$("token").value.trim()) { alert("GitHubトークンを入力してください"); return; }
  $("go").disabled = true;
  const cat = $("cat").value;
  for (const f of files) {
    const st = f._li.querySelector(".st");
    st.textContent = "送信中…";
    try {
      const path = encodeURIComponent(cat) + "/" + encodeURIComponent(f.name);
      const body = { message: `イラスト追加: ${f.name}`, content: await toBase64(f), branch: BRANCH };
      const cur = await api(path + "?ref=" + BRANCH);
      if (cur.ok) {
        if (!confirm(`${f.name} は既にあります。上書きしますか?`)) { st.textContent = "スキップ"; continue; }
        body.sha = (await cur.json()).sha;
      }
      const r = await api(path, { method: "PUT", body: JSON.stringify(body) });
      if (!r.ok) throw new Error((await r.json()).message || r.status);
      st.textContent = "完了"; st.className = "st ok";
    } catch (e) {
      st.textContent = "失敗: " + e.message; st.className = "st ng";
    }
  }
  files = files.filter(f => !f._li.querySelector(".ok"));
  $("go").disabled = files.length === 0;
};
</script>
</body>
</html>
